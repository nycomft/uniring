<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniRing - Kampüs Rota Bulucu</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

        :root {
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --accent: #8b5cf6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(-45deg, #0f172a, #1e1b4b, #0f172a, #172554);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        h1 {
            text-align: center;
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 35px;
        }

        .filter-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 30px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 0.9rem;
            color: #cbd5e1;
            letter-spacing: 0.5px;
        }

        select {
            width: 100%;
            padding: 14px 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            font-family: inherit;
            outline: none;
            transition: all 0.3s ease;
            appearance: none;
            cursor: pointer;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%2394a3b8%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 16px top 50%;
            background-size: 12px auto;
        }

        select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
        }

        select option {
            background-color: #1e293b;
            color: white;
        }

        .results-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        @keyframes slideUpFade {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .route-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            padding: 20px;
            border-radius: 16px;
            transition: all 0.3s ease;
            animation: slideUpFade 0.4s ease forwards;
        }

        .route-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 20px -10px rgba(0, 0, 0, 0.5);
        }

        .route-school {
            font-weight: 600;
            font-size: 1.15rem;
            margin-bottom: 12px;
            color: #e2e8f0;
        }

        .route-path {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
            color: #94a3b8;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .route-path span.icon {
            font-size: 1.2rem;
        }

        .ara-durak {
            color: #60a5fa; 
            font-weight: 500;
        }

        .route-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            text-decoration: none;
            padding: 12px 0;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px -3px rgba(99, 102, 241, 0.4);
        }

        .route-btn:hover {
            opacity: 0.9;
            transform: scale(1.02);
            box-shadow: 0 8px 20px -3px rgba(99, 102, 241, 0.6);
        }

        .no-results {
            text-align: center;
            color: var(--text-muted);
            padding: 30px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px dashed var(--glass-border);
            border-radius: 16px;
            animation: slideUpFade 0.4s ease forwards;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🚌 Akın Ring & Shuttle Hizmeti</h1>
        <p class="subtitle">Kalite tesadüf değildir.</p>

        <div class="filter-section">
            <div class="form-group">
                <label for="okulSelect">🏫 Üniversite</label>
                <select id="okulSelect"></select>
            </div>
            <div class="form-group">
                <label for="kalkisSelect">📍 Kalkış Noktası</label>
                <select id="kalkisSelect"></select>
            </div>
            <div class="form-group">
                <label for="varisSelect">🏁 Varış Noktası (Ana veya Ara Durak)</label>
                <select id="varisSelect"></select>
            </div>
        </div>

        <div class="results-section" id="resultsContainer">
            <!-- Sonuçlar buraya JavaScript ile eklenecek -->
        </div>
    </div>

    <script>
        // Veritabanı
        const rotalar = [
            // BOĞAZİÇİ ÜNİVERSİTESİ
            { okul: "Boğaziçi Üniversitesi", kalkis: "Güney Meydan", varis: "Etiler Kapı", link: "https://mekik.bogazici.edu.tr/route.php?id=1&lang=tr" },
            { okul: "Boğaziçi Üniversitesi", kalkis: "Etiler Kapı", varis: "Güney Meydan", link: "https://mekik.bogazici.edu.tr/route.php?id=2&lang=tr" },
            { okul: "Boğaziçi Üniversitesi", kalkis: "Güney Meydan", varis: "Hisar Kampüs", araDurak: "Etiler Kapı", link: "https://mekik.bogazici.edu.tr/route.php?id=3&lang=tr" },
            { okul: "Boğaziçi Üniversitesi", kalkis: "Hisar Kampüs", varis: "Güney Meydan", araDurak: "Etiler Kapı", link: "https://mekik.bogazici.edu.tr/route.php?id=4&lang=tr" },
            { okul: "Boğaziçi Üniversitesi", kalkis: "Anadolu Hisarı", varis: "Kilyos Kampüs", link: "https://mekik.bogazici.edu.tr/route.php?id=5&lang=tr" },
            { okul: "Boğaziçi Üniversitesi", kalkis: "Etiler Kapı", varis: "Anadolu & Kandilli", araDurak: "Anadolu Hisarı Kampüs", link: "https://mekik.bogazici.edu.tr/route.php?id=6&lang=tr" },
            { okul: "Boğaziçi Üniversitesi", kalkis: "Kandilli Kampüs", varis: "Anadolu & Etiler", araDurak: "Anadolu Hisarı Kampüs", link: "https://mekik.bogazici.edu.tr/route.php?id=7&lang=tr" },
            { okul: "Boğaziçi Üniversitesi", kalkis: "Etiler Kapı", varis: "Kilyos Kampüs", link: "https://mekik.bogazici.edu.tr/route.php?id=9&lang=tr" },
            { okul: "Boğaziçi Üniversitesi", kalkis: "Kilyos Kampüs", varis: "Etiler Kapı", link: "https://mekik.bogazici.edu.tr/route.php?id=10&lang=tr" },
            { okul: "Boğaziçi Üniversitesi", kalkis: "Kuzey Kampüs", varis: "Güney Meydan", araDurak: "Etiler Kapı", link: "https://mekik.bogazici.edu.tr/route.php?id=11&lang=tr" },
            { okul: "Boğaziçi Üniversitesi", kalkis: "Güney Meydan", varis: "Kuzey Kampüs", araDurak: "Etiler Kapı", link: "https://mekik.bogazici.edu.tr/route.php?id=12&lang=tr" },
            { okul: "Boğaziçi Üniversitesi", kalkis: "Kilyos Kampüs", varis: "Zekeriyaköy", link: "https://mekik.bogazici.edu.tr/route.php?id=15&lang=tr" },
            { okul: "Boğaziçi Üniversitesi", kalkis: "Zekeriyaköy", varis: "Kilyos Kampüs", link: "https://mekik.bogazici.edu.tr/route.php?id=16&lang=tr" },

            // DİĞER ÜNİVERSİTELER
            { okul: "İstanbul Gelişim Üniversitesi", kalkis: "Avcılar Metrobüs", varis: "Kampüs", link: "https://gelisim.edu.tr/ogrenci-ring-saatleri" },
            { okul: "İstanbul Gelişim Üniversitesi", kalkis: "Kampüs", varis: "Avcılar Metrobüs", link: "https://gelisim.edu.tr/ogrenci-ring-saatleri" },
            { okul: "Yıldız Teknik Üniversitesi", kalkis: "Cevizlibağ", varis: "Davutpaşa Kampüs", link: "https://yildiz.edu.tr/ulasim" }
        ];

        const okulSelect = document.getElementById('okulSelect');
        const kalkisSelect = document.getElementById('kalkisSelect');
        const varisSelect = document.getElementById('varisSelect');
        const resultsContainer = document.getElementById('resultsContainer');

        function populateSelect(selectElement, optionsArray) {
            selectElement.innerHTML = '<option value="Tümü">Tümünü Göster</option>';
            optionsArray.forEach(option => {
                const opt = document.createElement('option');
                opt.value = option;
                opt.textContent = option;
                selectElement.appendChild(opt);
            });
        }

        // Sadece tek bir property (örn: kalkis) çeken fonksiyon
        function getUniqueValues(key, data) {
            return [...new Set(data.map(item => item[key]))];
        }

        // Hem 'varis' hem de 'araDurak' verilerini birleştirip çeken yeni fonksiyon
        function getUniqueVarisVeAraDurak(data) {
            let tumHedefler = [];
            data.forEach(item => {
                if (item.varis) tumHedefler.push(item.varis);
                if (item.araDurak) tumHedefler.push(item.araDurak);
            });
            return [...new Set(tumHedefler)].sort(); // Alfabetik sıralayarak listeliyoruz
        }

        function updateUI(event) {
            const secilenOkul = okulSelect.value;
            
            let filtrelenmisVeri = rotalar;
            if (secilenOkul !== "Tümü") {
                filtrelenmisVeri = filtrelenmisVeri.filter(r => r.okul === secilenOkul);
            }

            // Okul değiştiğinde alt dropdownları güncelle
            if (event && event.target === okulSelect) {
                populateSelect(kalkisSelect, getUniqueValues('kalkis', filtrelenmisVeri));
                populateSelect(varisSelect, getUniqueVarisVeAraDurak(filtrelenmisVeri));
            }

            let sonucVerisi = filtrelenmisVeri;
            
            // Kalkış filtrelemesi
            if (kalkisSelect.value !== "Tümü") {
                sonucVerisi = sonucVerisi.filter(r => r.kalkis === kalkisSelect.value);
            }
            
            // Varış filtrelemesi (Seçilen yer varış noktasında VEYA ara durakta geçiyorsa kabul et)
            if (varisSelect.value !== "Tümü") {
                sonucVerisi = sonucVerisi.filter(r => 
                    r.varis === varisSelect.value || r.araDurak === varisSelect.value
                );
            }

            resultsContainer.innerHTML = '';
            
            if (sonucVerisi.length === 0) {
                resultsContainer.innerHTML = '<div class="no-results">Bu kriterlere uygun rota bulunamadı. Filtreleri sıfırlamayı deneyin.</div>';
                return;
            }

            sonucVerisi.forEach((rota, index) => {
                const card = document.createElement('div');
                card.className = 'route-card';
                card.style.animationDelay = `${index * 0.1}s`;
                
                let rotaIcerik = `
                    <span class="icon">📍</span>
                    <span>${rota.kalkis}</span>
                `;
                
                if (rota.araDurak) {
                    rotaIcerik += `
                        <span class="icon">➡️</span>
                        <span class="ara-durak">${rota.araDurak} (Ara Durak)</span>
                    `;
                }

                rotaIcerik += `
                    <span class="icon">➡️</span>
                    <span>${rota.varis}</span>
                `;

                card.innerHTML = `
                    <div class="route-school">${rota.okul}</div>
                    <div class="route-path">
                        ${rotaIcerik}
                    </div>
                    <a href="${rota.link}" target="_blank" class="route-btn">
                        <span>🌐</span> Resmi Sitede Saatleri Gör
                    </a>
                `;
                resultsContainer.appendChild(card);
            });
        }

        // Sayfa ilk yüklendiğinde dropdownları doldur
        populateSelect(okulSelect, getUniqueValues('okul', rotalar));
        populateSelect(kalkisSelect, getUniqueValues('kalkis', rotalar));
        populateSelect(varisSelect, getUniqueVarisVeAraDurak(rotalar));
        updateUI();

        // Olay Dinleyicileri
        okulSelect.addEventListener('change', updateUI);
        kalkisSelect.addEventListener('change', updateUI);
        varisSelect.addEventListener('change', updateUI);

    </script>
</body>
</html>
